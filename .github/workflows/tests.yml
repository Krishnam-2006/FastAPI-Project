name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blog_user
          POSTGRES_PASSWORD: blog_password
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog_user -d blog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://blog_user:blog_password@localhost:5432/blog_test
      TEST_DATABASE_URL: postgresql+psycopg://blog_user:blog_password@localhost:5432/blog_test
      SECRET_KEY: ci-only-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MAIL_SERVER: localhost
      MAIL_PORT: 2525
      MAIL_USERNAME: ci-user
      MAIL_PASSWORD: ci-password
      MAIL_FROM: noreply@example.com
      MAIL_USE_TLS: true
      FRONTEND_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest